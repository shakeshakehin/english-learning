name: Auto crawl articles
on:
  schedule:
    # 每天 UTC 22:00 = 香港 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "抓取关键词（逗号分隔，可留空用默认配置）"
        required: false
        type: string
      min_words:
        description: "最少字数（可留空用默认 250）"
        required: false
        type: string
      max_words:
        description: "最多字数（可留空用默认 5000）"
        required: false
        type: string
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run crawl and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python crawl_and_build.py --keyword "${{ github.event.inputs.keyword }}" --min-words "${{ github.event.inputs.min_words }}" --max-words "${{ github.event.inputs.max_words }}"
